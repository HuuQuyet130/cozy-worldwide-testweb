<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Detail</title>

<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/product.css">
<link rel="stylesheet" href="./css/cart.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<header>
    <header>
        <div class="left-icons">
            <a href="https://www.facebook.com/people/COZY-Worldwide/100077388649813/" class="fa-brands fa-facebook"></a>
            <a href="https://www.instagram.com/cozy.worldwidee/" class="fa-brands fa-instagram"></a>
            <a href="https://www.tiktok.com/@cozy.worldwide?fbclid=IwY2xjawLLp9ZleHRuA2FlbQIxMABicmlkETBya3ZDVFZkTVNzdGRldGxXAR5wuzXkduS9V8nLoHjUYGwrCJkxJPv1JLoFvBSmlxijhLgyPRh4hyUY55MJKw_aem_LLqNcjNfqG97k4roZqw1nw" class="fa-brands fa-tiktok"></a>
        </div>

        <div class="logo-container">
            <a href="index.html"><img src="img/banner/logo.webp" alt="Cozy Logo"></a>
        </div>
        <div class="right-icons">
            <a href="login.html" class="fa-regular fa-user"></a>
            <a href="cart.html" class="fa-solid fa-cart-shopping"></a>
        </div>
    </header>
</header>

<main class="product-detail">

    <!-- LEFT -->
    <div class="product-gallery">
        <img id="mainImg" class="main-img" src="">

        <div class="thumbs" id="thumbs">
            <img id="thumb1" alt="Thumbnail 1">
            <img id="thumb2" alt="Thumbnail 2">
        </div>
    </div>

    <!-- RIGHT -->
    <div class="product-info">
        <p class="shipping">COZY WORLDWIDE</p>

        <h1 id="name"></h1>
        <p class="price" id="price"></p>


        <div class="section">
            <p>Size</p>
            <div class="sizes">
                <button>S</button>
                <button>M</button>
                <button>L</button>
            </div>
        </div>

        <div class="section">
            <p>Quantity</p>
            <div class="qty">
                <button onclick="changeQty(-1)">-</button>
                <span id="qty">1</span>
                <button onclick="changeQty(1)">+</button>
            </div>
        </div>

        <button class="add-cart">Add to cart</button>
        <button class="buy-now">Buy Now</button>

        <div class="desc">
            <h3>Product Details</h3>
            <ul id="desc"></ul>
        </div>
    </div>
    
</main>
<div class="brand-intro">
    <p>
        COZY WORLDWIDE IS A CREW OF STYLE-MAKERS AND RULE-BREAKERS. 
        WE LIVE FOR SELF-EXPRESSION, KILLER FITS, AND THAT UNDENIABLE VIBE 
        THAT MAKES YOU FEEL SEEN. MORE THAN CLOTHES — IT’S A LIFESTYLE.
    </p>
    <span>@cozy.worldwidee</span>
</div>

<div class="divider"></div>

<footer></footer>

<script src="js/product.js" defer></script>

</body>
</html>
